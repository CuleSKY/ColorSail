<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>AutoJoin Applications</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 24px; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background: #f4f4f4; }
        .status-pending { color: #b45309; font-weight: bold; }
        .status-approved { color: #15803d; font-weight: bold; }
        .status-rejected { color: #b91c1c; font-weight: bold; }
    </style>
</head>
<body>
    <h1>AutoJoin Applications</h1>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Steam ID</th>
                <th>Status</th>
                <th>Created</th>
                <th>Reviewed</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            {% for app in applications %}
            <tr>
                <td>{{ app.id }}</td>
                <td>{{ app.steam_id }}</td>
                <td class="status-{{ app.status }}">{{ app.status }}</td>
                <td>{{ app.created_at_human }}</td>
                <td>{{ app.reviewed_at_human }}</td>
                <td><a href="/admin/applications/{{ app.id }}">View</a></td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
